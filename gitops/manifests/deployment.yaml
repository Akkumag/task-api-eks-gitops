apiVersion: apps/v1
kind: Deployment  
metadata:
  name: task-api
  namespace: task-api 
  labels:
    app: task-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-api
  template:
    metadata:
      labels:
        app: task-api
    spec: 
      containers:
        - name: task-api
          image: <ecr_repository_url>:latest
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10    
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000   
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"     